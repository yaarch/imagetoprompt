<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress noisy third-party browser extension errors (MetaMask, Phantom, etc.) injected into iframes
      window.addEventListener('unhandledrejection', function(e) {
        var r = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
        if (/MetaMask|ethereum|solana|chrome-extension|moz-extension/i.test(r)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var m = (e && e.message) ? String(e.message) : '';
        var f = (e && e.filename) ? String(e.filename) : '';
        if (/MetaMask|ethereum|solana/i.test(m) || /chrome-extension|moz-extension/i.test(f)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });

      // Automatic fallback for static hosting (Cloudflare Pages, GitHub Pages)
      // If the browser cannot run /src/main.tsx because it was served by static hosting without a Vite dev server,
      // seamlessly mount the pre-compiled bundle immediately!
      function loadPrecompiledBundle() {
        if (window.__BUNDLE_LOADED__) return;
        window.__BUNDLE_LOADED__ = true;

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './assets/index.css';
        css.onerror = function() {
          css.href = './dist/assets/index.css';
        };
        document.head.appendChild(css);

        var js = document.createElement('script');
        js.type = 'module';
        js.crossOrigin = 'anonymous';
        js.src = './assets/index.js';
        js.onerror = function() {
          var js2 = document.createElement('script');
          js2.type = 'module';
          js2.crossOrigin = 'anonymous';
          js2.src = './dist/assets/index.js';
          document.body.appendChild(js2);
        };
        document.body.appendChild(js);
      }

      // 1. Capture module/syntax failure from /src/main.tsx on static hosts
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var file = (e && e.filename) ? String(e.filename) : '';
        if (file.includes('main.tsx') || msg.includes('Failed to resolve') || msg.includes('Unexpected token')) {
          loadPrecompiledBundle();
        }
      }, true);

      // 2. Safety timer: If on a static host and #root has not been mounted by Vite dev server after 400ms
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            loadPrecompiledBundle();
          }
        }, 400);
      });
    </script>
    <title>Image to Prompt - AI Reverse Prompt Generator</title>
    <meta name="description" content="AI-powered image-to-prompt generator that converts images into detailed Midjourney, Stable Diffusion, Flux, and DALL-E prompts." />
    <meta property="og:title" content="Image to Prompt - AI Reverse Prompt Generator" />
    <meta property="og:description" content="AI-powered image-to-prompt generator that converts images into detailed Midjourney, Stable Diffusion, Flux, and DALL-E prompts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
