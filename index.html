<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress noisy third-party browser extension errors (MetaMask, Phantom, etc.) injected into iframes
      window.addEventListener('unhandledrejection', function(e) {
        var r = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
        if (/MetaMask|ethereum|solana|chrome-extension|moz-extension/i.test(r)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var m = (e && e.message) ? String(e.message) : '';
        var f = (e && e.filename) ? String(e.filename) : '';
        if (/MetaMask|ethereum|solana/i.test(m) || /chrome-extension|moz-extension/i.test(f)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });

      // Helpful detector if root source folder was deployed to Cloudflare Pages instead of the 'dist' folder
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            var banner = document.createElement('div');
            banner.id = 'cf-upload-guide';
            banner.style.cssText = 'position:fixed;inset:0;background:#0a0a0a;color:#f4f4f5;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;z-index:999999;';
            banner.innerHTML = '<div style="max-width:540px;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:28px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);text-align:center;">' +
              '<div style="font-size:32px;margin-bottom:12px;">📁</div>' +
              '<h2 style="font-size:20px;font-weight:700;color:#fff;margin:0 0 8px 0;">Cloudflare Pages Setup Notice</h2>' +
              '<p style="font-size:14px;color:#a1a1aa;margin:0 0 20px 0;line-height:1.5;">' +
              'The site is blank because the <strong>entire source project</strong> was uploaded rather than the compiled <strong>dist</strong> folder.' +
              '</p>' +
              '<div style="text-align:left;background:#09090b;border:1px solid #3f3f46;border-radius:10px;padding:16px;font-size:13px;color:#e4e4e7;line-height:1.6;">' +
              '<strong style="color:#fb923c;">To fix this immediately:</strong><br/>' +
              '1. <strong>Direct Upload (Drag & Drop):</strong> Drag the <code>dist</code> folder inside the project (not the root project folder).<br/>' +
              '2. <strong>Git on Cloudflare Pages:</strong> Set <em>Build output directory</em> to <code>dist</code> and <em>Build command</em> to <code>npm run build</code>.' +
              '</div>' +
              '</div>';
            document.body.appendChild(banner);
          }
        }, 1500);
      });
    </script>
    <title>Image to Prompt - AI Reverse Prompt Generator</title>
    <meta name="description" content="AI-powered image-to-prompt generator that converts images into detailed Midjourney, Stable Diffusion, Flux, and DALL-E prompts." />
    <meta property="og:title" content="Image to Prompt - AI Reverse Prompt Generator" />
    <meta property="og:description" content="AI-powered image-to-prompt generator that converts images into detailed Midjourney, Stable Diffusion, Flux, and DALL-E prompts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
